collections_config:
  sinks:
    name: The Kitchen Sink
    singular_name: Sink
    description: All inputs configured in various states.
    documentation:
      url: 'https://cloudcannon.com/documentation/articles/how-to-choose-what-input-is-used-in-the-data-editor/'
      text: Inputs documentation
    path: sinks
    icon: countertops
  duplicate_tests:
    name: Duplicate Tests
    singular_name: Plicate
    description: A test bed for duplicating and instance values
    path: duplicate-tests
    icon: nature_people
    _inputs:
      $.uuid:
        instance_value: UUID
      $.date:
        instance_value: NOW
      instance_values_blocks:
        type: array
        options:
          structures: _structures.instance_values_blocks
    
_structures:
  instance_values_blocks:
    values:
      - label: UUID
        value:
          inner_uuid:
        _inputs:
          inner_uuid:
            instance_value: UUID
        

